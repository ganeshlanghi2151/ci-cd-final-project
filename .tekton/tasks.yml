apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean up temporary files before running the pipeline.
  steps:
    - name: remove-temp-files
      image: alpine:3.20
      script: |
        #!/bin/sh
        echo "Cleaning up temporary files..."
        rm -rf /tmp/*
        echo "Cleanup completed."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Install Python dependencies and run unit tests using nose.
  steps:
    - name: run-unit-tests
      image: python:3.11
      script: |
        #!/bin/sh
        set -e
        python -m pip install --upgrade pip
        pip install nose
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        nosetests
